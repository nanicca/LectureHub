<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>고교 교사를 위한 생성형 AI · 수원여고 교원 연수</title>
  <meta name="description" content="수원여자고등학교 교원 연수 · ChatGPT 무료 계정으로 수업설계부터 세특까지" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script>
    /* 캐시버스터: data.js·app.js·style.css를 항상 최신으로 불러옵니다 (수정 불필요) */
    (function () {
      var v = Date.now();
      document.write('<link rel="stylesheet" href="style.css?v=' + v + '">');
      document.write('<script src="data.js?v=' + v + '"><\/script>');
      document.write('<script src="app.js?v=' + v + '" defer><\/script>');
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" type="button" aria-label="첫 화면으로"></button>
    <nav class="tabs" id="tabs" aria-label="파트 이동"></nav>
    <button class="toc-btn" id="tocBtn" type="button" aria-label="전체 목차">☰ <span>목차</span></button>
  </header>

  <main class="viewport" id="viewport">
    <div class="track" id="track"></div>
  </main>

  <footer class="bottombar">
    <button class="nav-btn" id="prevBtn" type="button" aria-label="이전 페이지">‹ 이전</button>
    <div class="progress-wrap">
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <div class="counter" id="counter"></div>
    </div>
    <button class="nav-btn next" id="nextBtn" type="button" aria-label="다음 페이지">다음 ›</button>
  </footer>

  <div class="toc" id="toc" hidden>
    <div class="toc-panel" role="dialog" aria-label="전체 목차">
      <div class="toc-head">
        <strong>전체 목차</strong>
        <button type="button" id="tocClose" aria-label="닫기">✕</button>
      </div>
      <div class="toc-body" id="tocBody"></div>
    </div>
  </div>

  <div class="toast" id="toast">복사했어요! ChatGPT에 붙여 넣으세요</div>
</body>
</html>
