<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상 펀딩 투표</title>
<style>
:root{--navy:#101A3C;--navy2:#1E2A57;--yellow:#F5B52E;--bg:#F4F6FB;--card:#fff;--text:#1B2340;--muted:#5B6585;--blue:#2F5BEA;--lblue:#E3EAFE;--lyellow:#FFF3D6;--green:#16A34A;--lgreen:#DCF5E5;--red:#DC2645;--line:#E2E6F0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
.top{background:var(--navy);color:#fff;padding:18px 16px}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;word-break:keep-all}
.top .who{font-size:14px;color:#C9D0EA}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--lblue);color:var(--navy)}
.btn.primary{background:var(--yellow);color:var(--navy)}
.btn.dark{background:var(--navy);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:#C9D0EA;border:1px solid #3A4675;padding:8px 12px;font-size:13px}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(27,35,64,.06);margin-bottom:14px}
.center{text-align:center}
h2{font-size:22px;margin:4px 0 6px}
.muted{color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=password],input[type=tel],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.err{color:var(--red);font-weight:700;font-size:14px;min-height:20px;margin-top:10px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab{flex:1;padding:12px;border-radius:12px;border:0;background:#fff;font-weight:700;color:var(--muted);cursor:pointer;box-shadow:0 1px 4px rgba(27,35,64,.06)}
.tab.on{background:var(--navy);color:#fff}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700}
.pill.ready{background:#EEF0F5;color:var(--muted)}.pill.open{background:var(--lgreen);color:#15803D}.pill.closed{background:#FDE2E6;color:var(--red)}
.pill.pending{background:var(--lyellow);color:#9A6B00}.pill.approved{background:var(--lgreen);color:#15803D}
.banner{border-radius:14px;padding:14px 16px;font-weight:700;margin-bottom:14px}
.banner.ready{background:#EEF0F5;color:var(--muted)}.banner.open{background:var(--lgreen);color:#15803D}.banner.closed{background:#FDE2E6;color:var(--red)}
.proj{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.proj .t{font-weight:800;font-size:17px;word-break:keep-all}
.proj .s{font-size:13px;color:var(--muted);margin-top:2px}
.proj a{font-size:13px;color:var(--blue);font-weight:700;text-decoration:none}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:0;background:var(--lblue);color:var(--navy);font-size:22px;font-weight:800;cursor:pointer}
.stepper button:disabled{opacity:.35}
.stepper .amt{min-width:76px;text-align:center;font-weight:800;font-size:17px;color:#B7791F}
.proj.picked{outline:2.5px solid var(--yellow)}
.proj.blocked{opacity:.55}
.badge{display:inline-block;background:#EEF0F5;color:var(--muted);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.reason{grid-column:1/-1}
.reason input{font-size:15px;padding:10px 12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 16px rgba(27,35,64,.1);padding:12px 16px}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;font-weight:800;font-size:15px}
.bar .sum small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;margin-top:2px}
.ok{color:var(--green)}.no{color:var(--red)}
.big-emoji{font-size:54px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips span{display:inline-block;background:var(--lyellow);border-radius:8px;padding:4px 8px;margin:3px;font-size:13px}
.tw{overflow-x:auto}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
/* ---------- 발표 화면 ---------- */
body.share{background:radial-gradient(ellipse at top,#22306A 0%,#101A3C 60%,#0A1130 100%);color:#fff;min-height:100vh;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 4vw;text-align:center;cursor:pointer;user-select:none}
.stage h1{font-size:clamp(32px,6vw,84px);margin:0 0 2vh}
.stage .sub{font-size:clamp(16px,2.4vw,32px);color:var(--yellow);font-weight:700}
.stage .hint{position:fixed;bottom:3vh;left:0;right:0;font-size:clamp(12px,1.4vw,18px);color:#8C97C4}
.prog{display:flex;gap:4vw;margin-top:5vh;flex-wrap:wrap;justify-content:center}
.prog .box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:3vh 3vw;min-width:240px}
.prog .n{font-size:clamp(36px,5vw,72px);font-weight:900;color:var(--yellow)}
.reveal{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.medal{font-size:clamp(70px,12vw,170px);line-height:1}
.rk{font-size:clamp(28px,4vw,56px);font-weight:900;margin-top:1vh}
.ptitle{font-size:clamp(34px,6vw,90px);font-weight:900;margin:1vh 0;word-break:keep-all}
.pmeta{font-size:clamp(16px,2.2vw,30px);color:#C9D0EA}
.pmoney{font-size:clamp(30px,5vw,72px);font-weight:900;color:var(--yellow);margin-top:1.5vh}
.preasons{margin-top:2vh;display:flex;flex-direction:column;gap:1vh;align-items:center}
.preasons span{background:rgba(255,255,255,.1);border-radius:99px;padding:.8vh 2vw;font-size:clamp(14px,1.8vw,24px)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2vw;width:100%;max-width:1400px}
.pod{flex:1;max-width:30vw;display:flex;flex-direction:column;align-items:center}
.pod .blk{width:100%;border-radius:16px 16px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:2vh;font-size:clamp(28px,4vw,60px);font-weight:900;color:var(--navy)}
.pod .nm{font-size:clamp(18px,2.4vw,36px);font-weight:900;margin:1vh 0 .5vh;word-break:keep-all}
.pod .mn{font-size:clamp(14px,1.8vw,26px);color:var(--yellow);font-weight:800;margin-bottom:1.5vh}
.ranklist{width:100%;max-width:1100px;max-height:72vh;overflow:auto;text-align:left}
.ranklist .r{display:grid;grid-template-columns:80px 1fr auto;gap:2vw;align-items:center;padding:1.4vh 2vw;border-bottom:1px solid rgba(255,255,255,.12);font-size:clamp(16px,2vw,28px)}
.ranklist .r b{color:var(--yellow)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:520px){.top h1{font-size:17px}.top .who{order:3;width:100%;font-size:13px}.tab{font-size:14px;padding:11px 6px;word-break:keep-all}.bar .sum{font-size:14px}.bar .btn{padding:12px 12px;white-space:nowrap}.stepper button{width:36px;height:36px}.stepper .amt{min-width:64px;font-size:15px}.proj .t{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<script>
var PAGE_RAW = "<?= page ?>";
var BASE_RAW = "<?= baseUrl ?>";
var ONLINE = typeof google !== "undefined" && google.script && google.script.run;
var API_URL = "https://script.google.com/macros/s/AKfycbzIIeuHZ19sEP6qNY_884aVbPdrVlVM5jaxRWgqSNdxKsaefraI_SYBeoBe930pQX2f/exec";
var REMOTE = !ONLINE && /github\.io$/.test(location.hostname);
var PAGE = ONLINE ? PAGE_RAW : (new URLSearchParams(location.search).get("page") || "");
var BASE = ONLINE ? BASE_RAW : location.origin + location.pathname;
var BUDGET = 1000000, STEP = 100000, MAX_PICK = 3, TEAMS = 8, PICKS = { personal: [3, 3], team: [1, 3] };
function pickText(c) { var k = PICKS[c]; return k[0] === k[1] ? "꼭 " + k[0] + "곳" : k[0] + "~" + k[1] + "곳"; }
var CATS = ["personal", "team"], CAT_NAME = { personal: "개인 프로젝트", team: "팀 프로젝트" }, CAT_ICON = { personal: "🙋", team: "👥" };
var STATUS_NAME = { ready: "시작 전", open: "투자 진행 중", closed: "마감" };

/* ---------- 서버 호출 ---------- */
var mockReady = null;
function loadMock() {
  if (mockReady) return mockReady;
  mockReady = new Promise(function (res) {
    var s = document.createElement("script");
    s.src = "Core.js";
    s.onload = function () {
      window.HASH = function (str) { var h = 5381; for (var i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; return "m" + h.toString(16); };
      res();
    };
    document.head.appendChild(s);
  });
  return mockReady;
}
function api(fn, args) {
  return new Promise(function (res, rej) {
    function done(r) { if (r && r.error) rej(new Error(r.error)); else res(r); }
    if (REMOTE) {
      fetch(API_URL, { method: "POST", body: JSON.stringify({ fn: fn, args: args || {} }) })
        .then(function (r) { return r.json(); }).then(done)
        .catch(function () { rej(new Error("연결이 불안정해요. 잠시 후 다시 해 주세요.")); });
      return;
    }
    if (ONLINE) { google.script.run.withSuccessHandler(done).withFailureHandler(function (e) { rej(new Error("연결이 불안정해요. 잠시 후 다시 해 주세요.")); }).rpc(fn, args || {}); return; }
    loadMock().then(function () {
      setTimeout(function () {
        var db; try { db = JSON.parse(localStorage.getItem("fund_mock_db")) || newDb(); } catch (e) { db = newDb(); }
        var r = dispatch(db, fn, args || {});
        if (WRITE_FNS.indexOf(fn) >= 0 && !(r && r.error)) localStorage.setItem("fund_mock_db", JSON.stringify(db));
        done(JSON.parse(JSON.stringify(r)));
      }, 120);
    });
  });
}

/* ---------- 도우미 ---------- */
var $app = document.getElementById("app");
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function won(n) { n = Number(n) || 0; if (n === 0) return "0원"; if (n % 10000 === 0) return (n / 10000).toLocaleString() + "만 원"; return n.toLocaleString() + "원"; }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
var toastT;
function toast(msg) { var t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); } t.textContent = msg; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(function () { t.style.display = "none"; }, 2600); }
function busy(btn, on) { if (!btn) return; btn.disabled = on; if (on) { btn.dataset.t = btn.textContent; btn.textContent = "잠시만요…"; } else if (btn.dataset.t) btn.textContent = btn.dataset.t; }
function typing() { var a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
function projSub(p) { return p.team ? p.team + "조" + (p.author ? " · " + p.author : "") : (p.author || ""); }

/* =====================================================
   학생 화면
   ===================================================== */
var S = { sess: store("fund_sess"), state: null, cat: "team", draft: { personal: null, team: null }, sig: "", authTab: "login" };

function studentStart() {
  if (S.sess) refreshStudent(true); else renderAuth();
  setInterval(function () { if (S.sess && !document.hidden) refreshStudent(false); }, 5000);
}
function refreshStudent(force) {
  api("myState", S.sess).then(function (st) {
    S.state = st;
    CATS.forEach(function (c) {
      var cs = st.cats[c];
      if (!S.draft[c] || cs.status !== "open" || force === "reset") {
        var d = {};
        cs.mine.forEach(function (m) { d[m.pid] = { amount: m.amount, reason: m.reason }; });
        S.draft[c] = d;
      }
    });
    var sig = JSON.stringify([st.me, CATS.map(function (c) { var x = st.cats[c]; return [x.status, x.submittedAt, x.projects]; })]);
    if (force || sig !== S.sig) { S.sig = sig; if (!typing() || force) renderStudent(); else S.sig = ""; }
  }).catch(function (e) {
    if (/로그인/.test(e.message)) { store("fund_sess", null); S.sess = null; renderAuth(e.message); }
  });
}
function topBar(title) {
  var who = S.state ? S.state.me.team + "조 · " + S.state.me.sid + " · " + S.state.me.name : "";
  return '<div class="top"><div class="in"><h1>💰 ' + esc(title) + '</h1>' + (who ? '<span class="who">' + esc(who) + '</span><button class="btn ghost" onclick="logout()">로그아웃</button>' : "") + "</div></div>";
}
function logout() { store("fund_sess", null); S.sess = null; S.state = null; S.sig = ""; S.draft = { personal: null, team: null }; renderAuth(); }

function renderAuth(msg) {
  var reg = S.authTab === "register";
  var teamOpts = '<option value="">조를 골라 주세요</option>' + Array.from({ length: TEAMS }, function (_, i) { return '<option value="' + (i + 1) + '">' + (i + 1) + "조</option>"; }).join("");
  $app.innerHTML = topBar("가상 펀딩 투표") + '<div class="wrap"><div class="card">' +
    '<div class="center"><div class="big-emoji">💸</div><h2>점수 대신 투자금으로!</h2><p class="muted">개인 프로젝트 100만 원, 팀 프로젝트 100만 원을 투자해요</p></div>' +
    '<div class="tabs"><button class="tab ' + (reg ? "" : "on") + '" onclick="S.authTab=\'login\';renderAuth()">로그인</button><button class="tab ' + (reg ? "on" : "") + '" onclick="S.authTab=\'register\';renderAuth()">처음이에요 (등록)</button></div>' +
    (reg ? '<label>조</label><select id="f_team">' + teamOpts + "</select>" : "") +
    '<label>학번</label><input id="f_sid" type="tel" inputmode="numeric" placeholder="예) 30301" autocomplete="username">' +
    (reg ? '<label>이름</label><input id="f_name" type="text" placeholder="예) 김중동">' : "") +
    '<label>비밀번호' + (reg ? " (4자리 이상, 내가 만들기)" : "") + '</label><input id="f_pw" type="password" autocomplete="' + (reg ? "new-password" : "current-password") + '">' +
    (reg ? '<label>비밀번호 한 번 더</label><input id="f_pw2" type="password" autocomplete="new-password">' : "") +
    '<div class="err" id="f_err">' + esc(msg || "") + '</div>' +
    '<button class="btn primary" style="width:100%;margin-top:6px" id="f_go" onclick="' + (reg ? "doRegister(this)" : "doLogin(this)") + '">' + (reg ? "등록하기" : "로그인") + "</button>" +
    (reg ? "" : '<p class="muted center" style="margin-top:14px">비밀번호를 잊었으면 선생님께 말해 주세요</p>') +
    "</div></div>";
  $app.querySelectorAll("input").forEach(function (i) { i.addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("f_go").click(); }); });
}
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; }
function setErr(m) { var e = document.getElementById("f_err"); if (e) e.textContent = m; }
function doRegister(btn) {
  if (val("f_pw") !== val("f_pw2")) return setErr("비밀번호 두 개가 달라요.");
  busy(btn, true);
  api("register", { sid: val("f_sid"), name: val("f_name"), team: val("f_team"), pw: val("f_pw") }).then(function (r) {
    S.sess = { sid: r.me.sid, token: r.token }; store("fund_sess", S.sess); refreshStudent(true);
  }).catch(function (e) { busy(btn, false); setErr(e.message); });
}
function doLogin(btn) {
  busy(btn, true);
  api("login", { sid: val("f_sid"), pw: val("f_pw") }).then(function (r) {
    S.sess = { sid: r.me.sid, token: r.token }; store("fund_sess", S.sess); refreshStudent(true);
  }).catch(function (e) { busy(btn, false); setErr(e.message); });
}
function doNewPw(btn) {
  if (val("f_pw") !== val("f_pw2")) return setErr("비밀번호 두 개가 달라요.");
  busy(btn, true);
  api("setPassword", Object.assign({ pw: val("f_pw") }, S.sess)).then(function () { toast("새 비밀번호를 만들었어요"); refreshStudent(true); })
    .catch(function (e) { busy(btn, false); setErr(e.message); });
}

function renderStudent() {
  var st = S.state, me = st.me;
  if (me.mustChange) {
    $app.innerHTML = topBar("새 비밀번호 만들기") + '<div class="wrap"><div class="card"><div class="center"><div class="big-emoji">🔑</div><h2>새 비밀번호를 만들어요</h2><p class="muted">선생님이 비밀번호를 초기화했어요</p></div>' +
      '<label>새 비밀번호 (4자리 이상)</label><input id="f_pw" type="password"><label>한 번 더</label><input id="f_pw2" type="password"><div class="err" id="f_err"></div>' +
      '<button class="btn primary" style="width:100%" onclick="doNewPw(this)">저장하기</button></div></div>';
    return;
  }
  if (me.status !== "approved") {
    $app.innerHTML = topBar("가상 펀딩 투표") + '<div class="wrap"><div class="card center"><div class="big-emoji">⏳</div><h2>선생님 승인을 기다리는 중</h2><p class="muted">승인되면 이 화면이 저절로 바뀌어요.<br>조를 잘못 골랐다면 선생님께 말해 주세요.</p><p style="font-weight:800;margin-top:16px">' + esc(me.team + "조 · " + me.sid + " · " + me.name) + "</p></div></div>";
    return;
  }
  var cat = S.cat, cs = st.cats[cat];
  var tabs = '<div class="tabs">' + ["team", "personal"].map(function (c) {
    var x = st.cats[c], mark = x.submittedAt ? " ✅" : "";
    return '<button class="tab ' + (c === cat ? "on" : "") + '" onclick="S.cat=\'' + c + '\';renderStudent()">' + CAT_ICON[c] + " " + CAT_NAME[c] + mark + "</button>";
  }).join("") + "</div>";
  var body = "";
  if (cs.status === "ready") {
    body = '<div class="banner ready">⚪ 아직 투자가 시작되지 않았어요. 발표를 보면서 기다려 주세요!</div>' + projectList(cs, false);
  } else if (cs.status === "closed") {
    body = '<div class="banner closed">🔴 투자가 마감됐어요. 결과 발표를 기다려 주세요!</div>' + myInvestSummary(cs);
  } else {
    body = '<div class="banner open">🟢 투자 진행 중! ' + (cs.submittedAt ? "제출 완료 — 마감 전까지 고칠 수 있어요" : "100만 원을 " + pickText(cat) + "에 나눠 투자해요") + "</div>" + projectList(cs, true);
  }
  $app.innerHTML = topBar("가상 펀딩 투표") + '<div class="wrap">' + tabs + body + "</div>" + (cs.status === "open" ? '<div class="bar"><div class="in" id="sumbar"></div></div>' : "");
  if (cs.status === "open") updateBar();
}
function projectList(cs, editable) {
  if (!cs.projects.length) return '<div class="card center muted">아직 프로젝트가 등록되지 않았어요</div>';
  var d = S.draft[S.cat] || {};
  return cs.projects.map(function (p) {
    var cur = d[p.id] || { amount: 0, reason: "" };
    var picked = cur.amount > 0;

function pollShare() {
  api("shareState").then(function (d) {
    var changed = !V.data || d.screen !== V.data.screen || d.screenSeq !== V.seq;
    var prevVer = V.data && V.data.ver;
    V.data = d;
    if (changed) { V.seq = d.screenSeq; V.step = 0; renderShare(d.screen === "order" ? true : false); }
    else if (d.screen === "wait" && d.ver !== prevVer) renderShare(false);
  }).catch(function () {});
}
function unlockAudio() {
  if (V.unlocked) return; V.unlocked = true;
  try { V.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function advance() {
  if (!V.unlocked) { unlockAudio(); renderShare(false); return; }
  if (!V.data || V.data.screen === "wait") return;
  var steps = revealSteps();
  if (V.step < steps.length - 1) { V.step++; renderShare(true); }
}
function revealSteps() {
  var res = (V.data.results || []).filter(function (r) { return r.total > 0; });
  var steps = [{ k: "intro" }];
  [3, 2, 1].forEach(function (rk) { var g = res.filter(function (r) { return r.rank === rk; }); if (g.length) steps.push({ k: "rank", rank: rk, items: g }); });
  steps.push({ k: "podium" }, { k: "all" });
  return steps;
}
function renderShare(animate) {
  var st = document.getElementById("stage"), d = V.data;
  if (!V.unlocked) { st.innerHTML = '<div class="big-emoji">🔊</div><h1>화면을 한 번 클릭해 주세요</h1><div class="sub">소리와 함께 결과를 발표해요</div>'; return; }
  if (!d) { st.innerHTML = "<h1>불러오는 중…</h1>"; return; }
  if (d.screen === "wait") {
    st.innerHTML = '<h1>💰 가상 펀딩 투표</h1><div class="sub">점수 대신 투자금으로 뽑는 최고의 프로젝트</div><div class="prog">' + ["team", "personal"].map(function (c) {
      return '<div class="box"><div style="font-size:clamp(16px,2vw,26px);font-weight:800">' + CAT_ICON[c] + " " + CAT_NAME[c] + '</div><div class="n">' + d.counts[c].done + " / " + d.counts[c].total + '</div><div style="color:#C9D0EA">' + STATUS_NAME[d.status[c]] + "</div></div>";
    }).join("") + '</div><div class="hint">결과 발표는 관리자 화면에서 시작해요</div>';
    return;
  }
  if (d.screen === "order") {
    var ord = d.order || [];
    var cols = ord.length > 10 ? 2 : 1;
    st.innerHTML = '<h1 style="font-size:clamp(28px,4.5vw,64px)">🎲 개인 프로젝트 발표 순서</h1><div style="display:grid;grid-template-columns:repeat(' + cols + ',minmax(0,1fr));gap:1.2vh 3vw;width:100%;max-width:1300px;text-align:left">' +
      ord.map(function (p, i) {
        return '<div class="reveal" style="animation-delay:' + (i * 0.35) + 's;display:flex;align-items:center;gap:1.5vw;background:rgba(255,255,255,.08);border-radius:14px;padding:1.2vh 1.5vw;font-size:clamp(18px,2.4vw,34px);font-weight:800">' +
          '<span style="color:var(--yellow);min-width:2.2em">' + (i + 1) + '번</span><span>' + esc(p.author || p.title) + '</span>' + (p.owner ? '<span style="color:#8C97C4;font-size:.6em;font-weight:600">' + esc(p.owner) + "</span>" : "") + "</div>";
      }).join("") + "</div>";
    if (animate !== false && V.orderSeq !== d.screenSeq) {
      V.orderSeq = d.screenSeq;
      ord.forEach(function (_, i) { tone(520 + i * 25, i * 0.35, 0.18, "triangle", 0.15); });
      setTimeout(function () { confetti(120); }, ord.length * 350 + 200);
    }
    return;
  }
  var cat = d.screen, steps = revealSteps(), s = steps[Math.min(V.step, steps.length - 1)];
  var res = (d.results || []).filter(function (r) { return r.total > 0; });
  var medal = { 1: "🥇", 2: "🥈", 3: "🥉" };
  var h = "";
  if (s.k === "intro") {
    h = '<div class="reveal"><div class="medal">' + CAT_ICON[cat] + "</div><h1>" + CAT_NAME[cat] + ' 투자 결과</h1><div class="sub">과연 투자금을 가장 많이 받은 프로젝트는?</div></div><div class="hint">클릭하면 3위부터 공개해요</div>';
  } else if (s.k === "rank") {
    h = '<div class="reveal"><div class="medal">' + medal[s.rank] + '</div><div class="rk">' + s.rank + "위" + (s.items.length > 1 ? " (공동)" : "") + "</div>" + s.items.map(function (r) {
      return '<div class="ptitle">' + esc(r.title) + '</div><div class="pmeta">' + esc(projSub(r)) + '</div><div class="pmoney">' + won(r.total) + ' <span style="font-size:.5em;color:#C9D0EA">· 투자자 ' + r.investors + "명</span></div>" +
        (r.reasons.length ? '<div class="preasons">' + r.reasons.map(function (x) { return "<span>💬 " + esc(x) + "</span>"; }).join("") + "</div>" : "");
    }).join("") + "</div>";
  } else if (s.k === "podium") {
    var col = function (rk, hgt, color) {
      var g = res.filter(function (r) { return r.rank === rk; });
      if (!g.length) return '<div class="pod"></div>';
      return '<div class="pod reveal"><div class="medal" style="font-size:clamp(50px,7vw,100px)">' + medal[rk] + '</div><div class="nm">' + g.map(function (r) { return esc(r.title); }).join(" · ") + '</div><div class="mn">' + won(g[0].total) + '</div><div class="blk" style="height:' + hgt + ";background:" + color + '">' + rk + "</div></div>";
    };
    h = '<h1 style="font-size:clamp(28px,4.5vw,64px)">🏆 ' + CAT_NAME[cat] + ' 시상대</h1><div class="podium">' + col(2, "22vh", "#C0C7D6") + col(1, "32vh", "#F5B52E") + col(3, "15vh", "#CD7F32") + "</div>";
  } else {
    var all = d.results || [];
    h = '<h1 style="font-size:clamp(26px,4vw,56px)">📋 ' + CAT_NAME[cat] + ' 전체 순위</h1><div class="ranklist">' + all.map(function (r) {
      return '<div class="r"><b>' + (r.total > 0 ? (medal[r.rank] || r.rank + "위") : "-") + '</b><div>' + esc(r.title) + ' <span style="color:#8C97C4;font-size:.75em">' + esc(projSub(r)) + "</span></div><b>" + won(r.total) + "</b></div>";
    }).join("") + "</div>";
  }
  st.innerHTML = h;
  if (animate) {
    if (s.k === "rank") { s.rank === 1 ? (sfxFanfare(), confetti(260)) : (sfxDing(s.rank), confetti(s.rank === 2 ? 70 : 40)); }
    if (s.k === "podium") { sfxFanfare(); confetti(320); }
  }
}

/* ---------- 효과음 (Web Audio) ---------- */
function tone(freq, t0, dur, type, vol) {
  var ac = V.ac; if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, ac.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.25, ac.currentTime + t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + 0.05);
}
function sfxDing(rank) { if (V.ac && V.ac.state === "suspended") V.ac.resume(); var base = rank === 3 ? 523 : 659; tone(base, 0, 0.5, "sine", 0.3); tone(base * 1.5, 0.12, 0.7, "sine", 0.25); }
function sfxFanfare() {
  if (V.ac && V.ac.state === "suspended") V.ac.resume();
  [[523, 0], [659, 0.14], [784, 0.28], [1047, 0.42]].forEach(function (n) { tone(n[0], n[1], 0.35, "square", 0.12); tone(n[0] / 2, n[1], 0.35, "triangle", 0.15); });
  [1047, 1319, 1568].forEach(function (f) { tone(f, 0.6, 1.4, "triangle", 0.12); });
  for (var i = 0; i < 6; i++) tone(180 + Math.random() * 80, 0.65 + i * 0.12, 0.12, "sawtooth", 0.05);
}

/* ---------- 폭죽 ---------- */
var FX = { parts: [], running: false };
function confetti(n) {
  var cv = document.getElementById("fx"), W = cv.width = innerWidth, H = cv.height = innerHeight;
  var colors = ["#F5B52E", "#FFFFFF", "#2F5BEA", "#DC2645", "#16A34A", "#FF8BD0", "#7DD3FC"];
  for (var b = 0; b < 3; b++) {
    var cx = W * (0.2 + 0.3 * b), cy = H * 0.35;
    for (var i = 0; i < n / 3; i++) {
      var a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 9;
      FX.parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, s: 5 + Math.random() * 7, c: colors[(Math.random() * colors.length) | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 160 + Math.random() * 80, delay: b * 12 });
    }
  }
  if (!FX.running) { FX.running = true; requestAnimationFrame(fxLoop); }
}
function fxLoop() {
  var cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  FX.parts = FX.parts.filter(function (p) { return p.life > 0; });
  FX.parts.forEach(function (p) {
    if (p.delay > 0) { p.delay--; return; }
    p.vy += 0.18; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life / 40); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
  });
  if (FX.parts.length) requestAnimationFrame(fxLoop); else { FX.running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
}

/* ---------- 시작 ---------- */
try { A.pw = sessionStorage.getItem("fund_admin_pw") || ""; } catch (e) {}
if (PAGE === "admin") adminStart();
else if (PAGE === "share") shareStart();
else studentStart();
</script>
