<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 디자인 & 숏폼 크리에이티브</title>
  <link rel="stylesheet" href="style.css?v=20261125b" />
</head>
<body>

  <!-- Hero -->
  <header class="hero">
    <div class="wrap">
      <span class="date" id="강의일자"></span>
      <h1 id="강의명"></h1>
      <p class="subtitle" id="부제"></p>
      <p class="intro" id="소개"></p>
    </div>
  </header>

  <main class="wrap">

    <!-- 회차 선택 -->
    <nav class="rounds" id="회차탭" aria-label="회차 선택"></nav>

    <!-- 강사 소개 -->
    <div class="instructor">
      <div class="box" id="강사"></div>
    </div>

    <!-- 차시 목록 -->
    <section class="section">
      <h2 class="section-title">강의 목차</h2>
      <p class="section-sub">카드를 누르면 강의 페이지로 이동합니다.</p>
      <div class="cards" id="차시목록"></div>
    </section>

    <!-- 자료 다운로드 -->
    <section class="section" id="자료섹션">
      <h2 class="section-title">강의 자료</h2>
      <p class="section-sub">실습에 쓰는 바로가기와 자료입니다.</p>
      <div class="files" id="자료목록"></div>
    </section>

  </main>

  <footer>
    <div class="wrap">© 2026 전혜영 · 경기미래교육 양평캠퍼스</div>
  </footer>

  <script>
    // data.js·app.js를 항상 최신으로 불러옵니다 (캐시 방지)
    (function () {
      var v = Date.now();
      function load(src, cb) {
        var s = document.createElement("script");
        s.src = src + "?v=" + v;
        s.onload = cb;
        document.head.appendChild(s);
      }
      load("data.js", function () { load("app.js", function () { renderIndex(); }); });
    })();
  </script>
</body>
</html>
