<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>생성형 AI와 함께하는 파이썬 데이터 분석 · 충북과학기술혁신원</title>
  <!-- style.css 도 항상 최신으로 불러옵니다 (캐시 방지) -->
  <script>
    document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '" />');
  </script>
  <noscript><link rel="stylesheet" href="style.css" /></noscript>
</head>
<body>

  <!-- Hero -->
  <header class="hero">
    <div class="wrap">
      <div class="topline">
        <span class="logos">
          <img class="logo-cbist" src="cbist-logo.png" alt="충북과학기술혁신원" />
          <span class="logo-div"></span>
          <img class="logo-kiea" src="kiea-logo.png" alt="한국강사교육협회" />
        </span>
        <span class="date" id="강의일자"></span>
      </div>
      <h1 id="강의명"></h1>
      <p class="subtitle" id="부제"></p>
      <p class="intro" id="소개"></p>
    </div>
  </header>

  <main class="wrap">

    <!-- 강사 소개 -->
    <div class="instructor">
      <div class="box" id="강사"></div>
    </div>

    <!-- 차시 목록 -->
    <section class="section">
      <h2 class="section-title">강의 목차</h2>
      <p class="section-sub">모듈을 선택하면 강의안과 실습 프롬프트로 이동합니다.</p>
      <div class="cards" id="차시목록"></div>
    </section>

    <!-- 자료 다운로드 -->
    <section class="section" id="자료섹션">
      <h2 class="section-title">강의 자료</h2>
      <p class="section-sub">실습 파일과 바로가기를 모았습니다.</p>
      <div class="files" id="자료목록"></div>
    </section>

  </main>

  <footer>
    <div class="wrap">© 2026 전혜영 · 한국강사교육협회 · 생성형 AI와 함께하는 파이썬 데이터 분석</div>
  </footer>

  <script>
    // data.js·app.js를 항상 최신으로 불러옵니다 (캐시 방지)
    (function () {
      var v = Date.now();
      function load(src, cb) {
        var s = document.createElement("script");
        s.src = src + "?v=" + v;
        s.onload = cb;
        document.head.appendChild(s);
      }
      load("data.js", function () { load("app.js", function () { renderIndex(); }); });
    })();
  </script>
</body>
</html>
