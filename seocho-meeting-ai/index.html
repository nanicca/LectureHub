<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서초구청 생성형 AI 활용 교육 · 2026.11.13</title>
  <!-- style.css 도 항상 최신으로 불러옵니다 (캐시 방지) -->
  <script>
    document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '" />');
  </script>
  <noscript><link rel="stylesheet" href="style.css" /></noscript>
</head>
<body>

  <!-- 상단 바로가기 (오전 목차 1 2 3 4 · 오후 목차 1 …) -->
  <nav class="topnav">
    <div class="inner" id="상단네비"></div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <div class="wrap">
      <div class="topline">
        <span class="logos">
          <img class="logo-seocho" src="seocho-logo.png" alt="서초구" />
          <span class="logo-div"></span>
          <img class="logo-kiea" src="kiea-logo.png" alt="한국강사교육협회" />
        </span>
        <span class="date" id="강의일자"></span>
      </div>
      <h1 id="강의명"></h1>
      <p class="subtitle" id="부제"></p>
      <p class="intro" id="소개"></p>
    </div>
  </header>

  <main class="wrap">

    <!-- 강사 소개 -->
    <div class="instructor">
      <div class="box" id="강사"></div>
    </div>

    <!-- 오전 · 오후 파트별 목차와 자료 (data.js 의 파트 목록으로 자동 생성) -->
    <div id="파트목록"></div>

  </main>

  <footer>
    <div class="wrap">© 2026 전혜영 · 한국강사교육협회 · 서초구청 생성형 AI 활용 교육</div>
  </footer>

  <script>
    // data.js·app.js를 항상 최신으로 불러옵니다 (캐시 방지)
    (function () {
      var v = Date.now();
      function load(src, cb) {
        var s = document.createElement("script");
        s.src = src + "?v=" + v;
        s.onload = cb;
        document.head.appendChild(s);
      }
      load("data.js", function () { load("app.js", function () { renderIndex(); }); });
    })();
  </script>
</body>
</html>
